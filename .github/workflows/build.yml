name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "RiderDeck-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RiderDeck-${{ github.run_number }}
          path: RiderDeck-*.apk

      - name: Publish as a release (download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RiderDeck build ${{ github.run_number }}
          body: Install the APK below on your phone. Each new build installs over the old one.
          files: RiderDeck-*.apk
          make_latest: "true"
