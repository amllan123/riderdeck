name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APKs
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle assembleFullDebug assembleLiteDebug --no-daemon --stacktrace

      - name: Name the APKs
        run: |
          cp app/build/outputs/apk/full/debug/app-full-debug.apk "RiderDeck-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk "RiderDeck-Lite-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RiderDeck-${{ github.run_number }}
          path: RiderDeck-*.apk

      - name: Publish as a release (download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RiderDeck build ${{ github.run_number }}
          body: |
            RiderDeck-N.apk is the full app. If Play Protect blocks it, install RiderDeck-Lite-N.apk (no song names, Maps turns or read-aloud).
            Each new build installs over the old one.
          files: RiderDeck-*.apk
          make_latest: "true"

  # Runs the app on an Android emulator in demo mode and attaches screenshots to the release.
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: RiderDeck-${{ github.run_number }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/shots.sh RiderDeck-${{ github.run_number }}.apk

      - name: Attach screenshots to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            shots/*.png
            shots/*.txt
